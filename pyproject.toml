[project]
name = "po2xlsx"
version = "0.1.0"
description = "Fixed-width purchase-order text to .xlsx"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
po2xlsx = "po2xlsx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
