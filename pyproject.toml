[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "po2xlsx"
version = "0.1.0"
description = "Fixed-width purchase-order text to .xlsx"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
po2xlsx = "po2xlsx.cli:main"

# samples/ and templates/ sit beside the package, so flat-layout discovery
# refuses to guess which one is the distribution.
[tool.setuptools]
packages = ["po2xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
